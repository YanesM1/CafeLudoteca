<select
    class="form-control"
    [id]="inputId || null"
    [name]="name"
    [value]="value"
    [disabled]="disabled"
    [required]="required"
    [attr.aria-label]="ariaLabel || placeholder"
    (change)="onChange($event)"
>
    <option value="" disabled>
        {{ placeholder }}
    </option>

    @for (option of options; track option.value) {
        <option
            [value]="option.value"
            [disabled]="option.disabled || false"
        >
            {{ option.label }}
        </option>
    }
</select>
