<div class="search-bar">

    <div class="search-bar__input">
        <app-input
            type="search"
            [name]="name"
            [placeholder]="placeholder"
            [value]="value"
            [disabled]="disabled"
            ariaLabel="Campo de búsqueda"
            (valueChange)="onValueChange($event)"
            (keyup.enter)="onSearch()"
        />
    </div>

    <app-button
        variant="primary"
        [disabled]="disabled"
        (click)="onSearch()"
    >
        <app-icon name="search" [size]="18" />
        {{ buttonText }}
    </app-button>

</div>
