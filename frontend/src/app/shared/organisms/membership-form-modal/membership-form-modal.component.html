@if (visible) {
    <div class="cl-modal-overlay" (click)="onClose()">
        <section class="cl-card cl-modal" role="dialog" aria-modal="true"
            aria-labelledby="membership-modal-title" (click)="$event.stopPropagation()">

            <h2 class="cl-card__title" id="membership-modal-title">
                {{ mode === 'create' ? 'Nueva membresía' : 'Editar membresía #' + form.identificador }}
            </h2>

            <form class="cl-form-grid" (ngSubmit)="onSave()">
                <label class="cl-field cl-field--full">Socio *
                    <select class="form-control" name="documento" [(ngModel)]="form.documento"
                        required [disabled]="mode === 'edit'">
                        <option value="" disabled>Selecciona un socio</option>
                        @for (s of opcionesSocio; track s.value) {
                            <option [value]="s.value">{{ s.label }}</option>
                        }
                    </select>
                    @if (mode === 'create' && !socioOptions.length) {
                        <span class="cl-field__hint">No hay socios registrados. Créalos en Clientes → Socios.</span>
                    }
                </label>

                <label class="cl-field">Plan *
                    <select class="form-control" name="plan" [(ngModel)]="form.plan" required>
                        <option value="" disabled>Selecciona un plan</option>
                        @for (p of opcionesPlan; track p.plan) {
                            <option [value]="p.plan">{{ p.plan }}</option>
                        }
                    </select>
                </label>
                <div class="cl-field">Tarifa mensual
                    <span class="cl-readonly">{{ tarifaTexto }}</span>
                </div>

                <label class="cl-field">Fecha de inicio *
                    <input class="form-control" type="date" name="fechaInicio" [(ngModel)]="form.fechaInicio" required>
                </label>
                <label class="cl-field">Duración *
                    <select class="form-control" name="duracion" [(ngModel)]="duracion" required>
                        @if (mode === 'edit') {
                            <option [ngValue]="0">Mantener fecha de fin</option>
                        }
                        @for (d of duraciones; track d) {
                            <option [ngValue]="d">{{ d }} {{ d === 1 ? 'mes' : 'meses' }}</option>
                        }
                    </select>
                </label>

                <div class="cl-field">Vence el
                    <span class="cl-readonly">{{ fechaFinTexto }}</span>
                </div>
                <label class="cl-field">Estado *
                    <select class="form-control" name="estado" [(ngModel)]="form.estado" required>
                        @for (option of statusOptions; track option.value) {
                            <option [value]="option.value">{{ option.label }}</option>
                        }
                    </select>
                </label>

                <div class="cl-form-actions">
                    <button class="btn btn--ghost" type="button" [disabled]="saving" (click)="onClose()">Cancelar</button>
                    <button class="btn btn--gold" type="submit" [disabled]="!canSave || saving">
                        {{ saving ? 'Guardando...' : 'Guardar membresía' }}
                    </button>
                </div>
            </form>
        </section>
    </div>
}
