<div class="admin-layout">

    <app-navbar
        [brand]="brand"
        [homeRoute]="'/admin'"
        [links]="navigationLinks"
        [showCartButton]="false"
        [showRoleSwitch]="true"
        [showUserButton]="true"
        [userLabel]="userLabel"
    />

    @if (activeSection && activeSection.pages.length > 1) {
        <nav class="admin-tabs" [attr.aria-label]="'Páginas de ' + activeSection.label">
            <div class="admin-tabs__inner">
                @for (page of activeSection.pages; track page.route) {
                    <a
                        class="admin-tabs__tab"
                        [routerLink]="page.route"
                        routerLinkActive="admin-tabs__tab--active"
                    >
                        {{ page.label }}
                    </a>
                }
            </div>
        </nav>
    }

    <main class="cl-layout-main">
        <div class="cl-layout-content">
            <router-outlet />
        </div>
    </main>

</div>
