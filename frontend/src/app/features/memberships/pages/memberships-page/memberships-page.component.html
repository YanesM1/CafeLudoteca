<section>

    <div class="memberships-page__notification">

        <app-notification-toast
            [visible]="notificationVisible"
            [type]="notificationType"
            [title]="notificationTitle"
            [message]="notificationMessage"
            (dismiss)="closeNotification()"
        />

    </div>

    <app-membership-table
        [members]="members"
        [loading]="loading"
        (createMember)="openCreate()"
        (editMember)="openEdit($event)"
        (deleteMember)="requestDelete($event)"
    />

    <app-membership-form-modal
        [visible]="showModal"
        [mode]="modalMode"
        [member]="selectedMember"
        [socioOptions]="socioOptions"
        [planes]="planes"
        [saving]="saving"
        (save)="saveMember($event)"
        (close)="closeModal()"
    />

    @if (memberToDelete) {
        <div class="cl-modal-overlay" (click)="cancelDelete()">
            <section class="cl-card cl-modal" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
                <h2 class="cl-card__title">Eliminar membresía</h2>
                <p>¿Deseas eliminar la membresía #{{ memberToDelete.identificador }} de
                    <strong>{{ memberToDelete.nombre }}</strong>?</p>
                <div class="cl-form-actions">
                    <button class="btn btn--ghost" type="button" (click)="cancelDelete()">Cancelar</button>
                    <button class="btn btn--danger" type="button" (click)="confirmDelete()">Eliminar</button>
                </div>
            </section>
        </div>
    }

</section>
